openapi: 3.1.0
info:
  title: exit1.dev API
  description: |
    The exit1.dev API provides programmatic access to your website monitoring data.

    This file covers the read endpoints. Write endpoints (create, update,
    delete, toggle) are documented at https://docs.exit1.dev/api-reference.

    ## Authentication
    All requests must include an `X-Api-Key` header with a valid API key.
    API access is available on all plans.

    ## Timestamps
    All timestamps in responses are Unix epoch milliseconds.

    ## Rate Limits (API keys)
    - Pre-authentication: 20 requests/minute per IP
    - Per API key: 5 requests/minute
    - Per endpoint per key: 1 request/minute
    - Daily per key: 500 requests
    - Daily per user: 2,000 requests
  version: "1.1.0"
  contact:
    name: exit1.dev Support
    url: https://exit1.dev
    email: connect@exit1.dev

servers:
  - url: https://us-central1-exit1-dev.cloudfunctions.net/publicApi
    description: Production API

security:
  - ApiKeyAuth: []

paths:
  /v1/public/checks:
    get:
      operationId: listChecks
      summary: List checks
      description: Retrieve a list of all monitoring checks in your account.
      tags:
        - Checks
      parameters:
        - name: limit
          in: query
          description: Number of results per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page
          in: query
          description: Page number for offset pagination. Ignored when cursor is set.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: cursor
          in: query
          description: The nextCursor value from a previous response
          schema:
            type: string
        - name: status
          in: query
          description: Filter by check status. Any other value returns 400.
          schema:
            type: string
            enum:
              - all
              - online
              - offline
              - degraded
              - unknown
            default: all
        - name: includeTotal
          in: query
          description: Set to false to skip counting; total and totalPages are then null.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of checks
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Check"
                  meta:
                    $ref: "#/components/schemas/CheckListMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/checks/{id}:
    get:
      operationId: getCheck
      summary: Get check
      description: Retrieve details for a single monitoring check.
      tags:
        - Checks
      parameters:
        - $ref: "#/components/parameters/CheckId"
      responses:
        "200":
          description: Check details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/checks/{id}/history:
    get:
      operationId: getCheckHistory
      summary: Check history
      description: Retrieve the execution history for a specific check, newest first.
      tags:
        - History
      parameters:
        - $ref: "#/components/parameters/CheckId"
        - name: limit
          in: query
          description: Number of results per page (max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: from
          in: query
          description: Only results at or after this time. ISO 8601 or a Unix timestamp in seconds or milliseconds.
          schema:
            type: string
        - name: to
          in: query
          description: Only results at or before this time. ISO 8601 or a Unix timestamp in seconds or milliseconds.
          schema:
            type: string
        - name: status
          in: query
          description: Only results with this exact status (for example online, offline, degraded, disabled). Defaults to all.
          schema:
            type: string
            default: all
        - name: q
          in: query
          description: Case-sensitive substring match against the error message and status
          schema:
            type: string
      responses:
        "200":
          description: Check history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  meta:
                    $ref: "#/components/schemas/HistoryMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/checks/{id}/stats:
    get:
      operationId: getCheckStats
      summary: Check stats
      description: |
        Retrieve uptime statistics for a specific check.

        Single-range mode (default) uses `from` and `to`. The window never
        starts more than 90 days before now; omitting `from` means 90 days ago.

        Multi-range mode uses `ranges` and returns an object keyed by range
        name, each value having the Stats shape. `from` is ignored in this mode.
      tags:
        - Statistics
      parameters:
        - $ref: "#/components/parameters/CheckId"
        - name: from
          in: query
          description: Start of the window (single-range mode). ISO 8601 or Unix timestamp. Defaults to 90 days ago and is clamped to at most 90 days ago.
          schema:
            type: string
        - name: to
          in: query
          description: End of the window. ISO 8601 or Unix timestamp. Defaults to now.
          schema:
            type: string
        - name: ranges
          in: query
          description: Comma-separated predefined ranges (max 5). Allowed values are 1h, 6h, 1d, 7d, 30d, 60d, 90d.
          schema:
            type: string
            example: "1d,7d,30d"
      responses:
        "200":
          description: Uptime statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Stats"
                      - type: object
                        description: Multi-range result keyed by range name
                        additionalProperties:
                          $ref: "#/components/schemas/Stats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        API key for authentication. Create keys at Settings > API.
        Format: `ek_live_<64 hex characters>`

  parameters:
    CheckId:
      name: id
      in: path
      required: true
      description: The unique check identifier (letters, digits, - and _, max 128 characters)
      schema:
        type: string

  headers:
    RateLimit-Limit:
      description: Maximum requests allowed in the current window
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests remaining in the current window
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the current window resets
      schema:
        type: integer
    RateLimit:
      description: Combined form, for example "limit=1, remaining=0, reset=42"
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before retrying (429 responses only)
      schema:
        type: integer

  schemas:
    Check:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        name:
          type: string
          description: Display name. Falls back to url when unset.
          example: "Production Website"
        url:
          type: string
          description: Monitored URL, host or domain. Heartbeat checks return heartbeat://<token>, domain checks return domain://<domain>.
          example: "https://example.com"
        status:
          type: string
          enum:
            - online
            - offline
            - degraded
            - unknown
          example: "online"
        lastChecked:
          type: integer
          description: >-
            Epoch ms of the last synced result (0 if never checked). Synced on
            status changes and at least once every 24 hours.
          example: 1736951400000
        responseTime:
          type: [integer, "null"]
          description: Response time in ms from the last synced result
          example: 245
        lastStatusCode:
          type: [integer, "null"]
          description: HTTP status code from the last synced result
          example: 200
        type:
          type: string
          description: Check type. Some older checks report the legacy values api or rest.
          enum:
            - website
            - rest_endpoint
            - redirect
            - ping
            - tcp
            - udp
            - websocket
            - dns
            - heartbeat
            - domain
            - api
            - rest
          example: "website"
        checkFrequency:
          type: [number, "null"]
          description: Minutes between checks
          example: 5
        region:
          type: [string, "null"]
          description: Region the check runs from
          example: "vps-eu-1"
        folder:
          type: [string, "null"]
        severity:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: 1 (P1, critical) to 5 (P5, minimal); null when unset
        lastError:
          type: [string, "null"]
        disabled:
          type: boolean
        maintenanceMode:
          type: boolean
        maintenanceUntil:
          type: [integer, "null"]
          description: Epoch ms when the current maintenance window ends
        maintenanceScheduledStart:
          type: [integer, "null"]
          description: Epoch ms of an upcoming one-time maintenance window
        maintenanceRecurring:
          type: [object, "null"]
          properties:
            daysOfWeek:
              type: array
              items:
                type: integer
            startTimeMinutes:
              type: integer
            durationMinutes:
              type: integer
            timezone:
              type: string
            reason:
              type: [string, "null"]
            createdAt:
              type: integer
        sslCertificate:
          type: [object, "null"]
          properties:
            valid:
              type: boolean
            issuer:
              type: string
            subject:
              type: string
            validFrom:
              type: integer
              description: Epoch ms
            validTo:
              type: integer
              description: Epoch ms
            daysUntilExpiry:
              type: integer
            lastChecked:
              type: integer
              description: Epoch ms
            error:
              type: string
        domainExpiry:
          type: [object, "null"]
          description: Null unless Domain Intelligence is enabled for the check
          properties:
            domain:
              type: [string, "null"]
            registrar:
              type: [string, "null"]
            expiryDate:
              type: [integer, "null"]
              description: Epoch ms
            daysUntilExpiry:
              type: [integer, "null"]
        lastPingAt:
          type: [integer, "null"]
          description: Heartbeat checks only (absent for other types). Epoch ms of the last ping.
        createdAt:
          type: integer
          description: Epoch ms
        updatedAt:
          type: integer
          description: Epoch ms

    HistoryEntry:
      type: object
      description: Optional fields are omitted rather than sent as null.
      required:
        - id
        - checkId
        - websiteId
        - timestamp
        - status
        - createdAt
      properties:
        id:
          type: string
          example: "hist_001"
        checkId:
          type: string
          example: "abc123"
        websiteId:
          type: string
          deprecated: true
          description: Same value as checkId
          example: "abc123"
        timestamp:
          type: integer
          description: Epoch ms when the check ran
          example: 1736951400000
        status:
          type: string
          description: Result status, for example online, offline, degraded or disabled
          example: "online"
        responseTime:
          type: number
          description: Response time in ms
          example: 245
        statusCode:
          type: integer
          example: 200
        error:
          type: string
        redirectLocation:
          type: string
        createdAt:
          type: integer
          description: Same value as timestamp
          example: 1736951400000

    Stats:
      type: object
      properties:
        totalChecks:
          type: integer
          example: 720
        onlineChecks:
          type: integer
          example: 714
        offlineChecks:
          type: integer
          description: Confirmed offline results outside maintenance
          example: 6
        uptimePercentage:
          type: number
          description: onlineDurationMs / totalDurationMs * 100, or 0 when there is no data
          example: 97.5
        totalDurationMs:
          type: integer
          example: 86400000
        onlineDurationMs:
          type: integer
          example: 84240000
        offlineDurationMs:
          type: integer
          example: 2160000
        responseSampleCount:
          type: integer
          example: 714
        avgResponseTime:
          type: number
          example: 245.1
        minResponseTime:
          type: number
          example: 120
        maxResponseTime:
          type: number
          example: 890

    CheckListMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        total:
          type: [integer, "null"]
          description: Null when includeTotal=false
          example: 12
        totalPages:
          type: [integer, "null"]
          description: Null when includeTotal=false
          example: 1
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
        nextCursor:
          type: [string, "null"]

    HistoryMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        total:
          type: "null"
        totalPages:
          type: "null"
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
        retryAfter:
          type: integer
          description: Seconds to wait before retrying (429 responses)
        quotaLimit:
          type: integer
          description: Daily request quota (daily-quota 429 responses only)
        quotaReset:
          type: integer
          description: Epoch ms when the daily quota resets (daily-quota 429 responses only)

  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Invalid check ID format"

    Unauthorized:
      description: Missing, invalid or disabled credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Invalid API key"

    Forbidden:
      description: Missing scope, or the check belongs to another account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Credential does not have the required scope: checks:read"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not found"

    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Rate limit exceeded. Please try again later."
            retryAfter: 42

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Internal error"
